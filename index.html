<script>
    /* ============================================
       INITIALIZATION - Panggil setup saat DOM siap
       ============================================ */
    document.addEventListener('DOMContentLoaded', function () {
        setupEventListeners();

        /* Tampilkan pesan sukses jika baru selesai registrasi */
        <?php if ($registered && $emailFromReg): ?>
        showSuccess('Registrasi berhasil! Silakan login dengan akun Anda.');
        <?php endif; ?>
    });

    function setupEventListeners() {
        document.getElementById('loginForm').addEventListener('submit', handleLogin);
        document.getElementById('togglePassword').addEventListener('click', togglePassword);
        document.getElementById('email').addEventListener('blur', validateEmail);
        document.getElementById('password').addEventListener('blur', validatePassword);

        document.getElementById('email').addEventListener('input', function () {
            clearError('email');
        });
        document.getElementById('password').addEventListener('input', function () {
            clearError('password');
        });
    }

    async function handleLogin(e) {
        e.preventDefault();

        if (!validateEmail() || !validatePassword()) return;

        const email     = document.getElementById('email').value.trim();
        const password  = document.getElementById('password').value;
        const btnSubmit = document.getElementById('btnSubmit');

        btnSubmit.classList.add('loading');

        try {
            const formData = new FormData();
            formData.append('email', email);
            formData.append('password', password);

            const response = await fetch('process_login.php', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            btnSubmit.classList.remove('loading');

            if (data.status === 'success') {
                showSuccess(data.message);
                setTimeout(function () {
                    window.location.href = data.redirect || 'index.php';
                }, 1500);
            } else {
                showError(data.message || 'Email atau password salah!');
                const container = document.querySelector('.login-container');
                container.style.animation = 'shake 0.5s';
                setTimeout(function () { container.style.animation = ''; }, 500);
            }

        } catch (err) {
            btnSubmit.classList.remove('loading');
            showError('Terjadi kesalahan. Silakan coba lagi.');
            console.error('Login error:', err);
        }
    }

    function validateEmail() {
        const email      = document.getElementById('email').value.trim();
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (!email) { showFieldError('email', 'Email tidak boleh kosong'); return false; }
        if (!emailRegex.test(email)) { showFieldError('email', 'Format email tidak valid'); return false; }
        clearError('email');
        return true;
    }

    function validatePassword() {
        const password = document.getElementById('password').value;

        if (!password) { showFieldError('password', 'Password tidak boleh kosong'); return false; }
        if (password.length < 6) { showFieldError('password', 'Password minimal 6 karakter'); return false; }
        clearError('password');
        return true;
    }

    function showFieldError(fieldName, message) {
        document.getElementById(fieldName).classList.add('error');
        const el = document.getElementById(fieldName + 'Error');
        el.textContent = message;
        el.classList.add('show');
    }

    function clearError(fieldName) {
        document.getElementById(fieldName).classList.remove('error');
        document.getElementById(fieldName + 'Error').classList.remove('show');
    }

    function showError(message) {
        const alertError = document.getElementById('alertError');
        document.getElementById('errorMessage').textContent = message;
        alertError.classList.add('show');
        setTimeout(function () { alertError.classList.remove('show'); }, 5000);
    }

    function showSuccess(message) {
        const alertSuccess = document.getElementById('alertSuccess');
        document.getElementById('successMessage').textContent = message;
        alertSuccess.classList.add('show');
        setTimeout(function () { alertSuccess.classList.remove('show'); }, 5000);
    }

    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon    = document.getElementById('togglePassword');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            toggleIcon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    }

    const style = document.createElement('style');
    style.textContent = `
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }
    `;
    document.head.appendChild(style);
</script>
